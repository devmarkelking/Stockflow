services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    volumes:
      - ./src:/var/www/html
      
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"

    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

  mysql:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3306:3306"
  
  redis:
    image: redis:7-alpine
    
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: